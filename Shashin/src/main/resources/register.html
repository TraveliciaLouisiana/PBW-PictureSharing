<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            pad: 0;
        }

        body {
            background-color: #FAF7F2;
        }

        h2 {
            color: #540B0E;
            font-weight: bolder;
            display: flex;
            justify-content: center;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            row-gap: 10px;
        }

        .input_form {}

        input {
            border-radius: 12px;
            border: solid black 1px;
            padding: 10px;
        }

        .submit_button {
            border-radius: 12px;
            border: solid #540B0E;
            padding: 10px 30px;
        }
    </style>
</head>

<body>
    <h2>Register</h2>
    <form method="post">
        <label>
            <span class="input_form">Username : </span>
            <input type="text">
        </label>
        <span th:if="${#fields.hasErrors()}" th:errors="*{username}">Username Error</span>

        <label>
            <span class="input_form">Email : </span>
            <input type="text">
        </label>
        <span th:if="${#fields.hasErrors()}" th:errors="*{email}">Email Error</span>

        <label>
            <span class="input_form">Password : </span>
            <input type="password">
        </label>
        <span th:if="${#fields.hasErrors()}" th:errors="*{password}">password Error</span>

        <input type="submit" value="Register" class="submit_button">
    </form>
</body>

</html>
